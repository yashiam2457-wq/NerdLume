# NerdLume (NerdyBro) Production Reverse Proxy Configuration
# Architecture: External Client -> TLS 1.3 Termination (Port 443) -> Loopback (127.0.0.1:5050)

# Rate limiting zones per client IP
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
limit_req_status 429;

upstream nerdybro_backend {
    server 127.0.0.1:5050;
    keepalive 32;
}

# HTTP port 80: Permanent redirection to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nerdybro.in www.nerdybro.in;

    # ACME Challenge for Let's Encrypt / Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS port 443: Strict TLS 1.3 Termination
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nerdybro.in www.nerdybro.in;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/nerdybro.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nerdybro.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/nerdybro.in/chain.pem;

    # Protocols & Ciphers: Enforce modern TLS 1.3
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Session caching & ticket parameters
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Defensive Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Maximum payload size (supports document/PDF uploads)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Timeouts
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 65s;

    # Authentication endpoints: Stricter rate bounding
    location ~* ^/api/auth/(login|signup|reset-password) {
        limit_req zone=api_auth burst=10 nodelay;

        proxy_pass http://nerdybro_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Generation API endpoint
    location /api/generate {
        limit_req zone=api_general burst=15 nodelay;

        proxy_pass http://nerdybro_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";

        # AI generation responses can take 15 to 45 seconds
        proxy_connect_timeout 15s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # General API routes
    location /api/ {
        limit_req zone=api_general burst=30 nodelay;

        proxy_pass http://nerdybro_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Static assets and frontend SPA routing
    location / {
        proxy_pass http://nerdybro_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_intercept_errors off;
    }
}

